aid: equitybee
name: EquityBee
description: EquityBee is a fintech marketplace that helps startup employees fund the exercise
  of their stock options before those options expire, giving them the cash needed to purchase
  their equity while the company is still private. On the other side of the marketplace,
  EquityBee connects accredited investors with the opportunity to invest in pre-IPO companies
  by funding those employee option exercises in exchange for a share of the future proceeds.
  Founded in 2018, the company operates a two-sided platform spanning startup employees,
  accredited investors, and the private companies whose equity underlies each funded position.
  EquityBee publishes a public marketing and account website but exposes no public developer
  API, SDK, or machine-readable API discovery surface at this time.
